name: Bug report
description: Report reproducible incorrect rvw behavior
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, private source, and sensitive registry content before submitting.

  - type: input
    id: version
    attributes:
      label: rvw version and installation
      description: Include `rvw --version` and whether rvw came from PyPI, uvx, or a source checkout.
      placeholder: "rvw 0.2.0 installed with uv tool"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      description: Provide the smallest command and sanitized inputs that reproduce the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and sanitized output or traceback.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: run_id
    attributes:
      label: Run ID
      description: If available, provide the `run_id` printed by rvw.
      placeholder: "r-..."

  - type: textarea
    id: lane_registry
    attributes:
      label: Lane and registry context
      description: Name relevant lane IDs, registry revision, target type, and whether a custom registry was used. Do not paste private lane bodies.
      placeholder: "lane IDs, registry revision, PR/local target"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, uv version, and Codex CLI version when applicable.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private source, and sensitive registry content.
          required: true
        - label: I searched existing issues for this problem.
          required: true
