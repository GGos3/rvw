name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4 — same pin as codex-lb; v5 silently no-ops the uv.lock toml updater
        with:
          # RELEASE_PLEASE_TOKEN is a required PAT (codex-lb pattern): tags it
          # pushes trigger release.yml via the tag event. PyPI Trusted
          # Publishing rejects OIDC claims from reusable-caller chains, and
          # tags created by the default repository token never start
          # workflows, so neither alternative can publish.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
